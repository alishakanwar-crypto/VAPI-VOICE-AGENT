<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbound FAQ Agent</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; }
      .card { max-width: 560px; margin: 0 auto; padding: 20px; border: 1px solid #e5e7eb; border-radius: 12px; }
      button { width: 100%; padding: 14px 16px; font-size: 16px; border-radius: 10px; border: 0; cursor: pointer; }
      #start { background: #111827; color: white; }
      #stop { background: #ef4444; color: white; margin-top: 10px; }
      .hint { color: #6b7280; font-size: 14px; margin-top: 10px; line-height: 1.4; }
      .status { margin-top: 12px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Talk to the agent</h1>
      <p class="hint">
        Tap <b>Start</b>, allow microphone access, then speak naturally.
      </p>

      <button id="start">Start voice</button>
      <button id="stop" disabled>Stop</button>

      <div class="status" id="status">Status: idle</div>
    </div>

    <script type="module">
      import Vapi from "https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/vapi-web.esm.js";

      const PUBLIC_KEY = "af7ef00a-7356-4499-9e0c-94a540080e5d";
      const ASSISTANT_ID = "3d5a06c7-fbc8-48d3-bc34-6fe5966e59d7";

      const statusEl = document.getElementById("status");
      const startBtn = document.getElementById("start");
      const stopBtn = document.getElementById("stop");

      const vapi = new Vapi(PUBLIC_KEY);

      function setStatus(s) {
        statusEl.textContent = `Status: ${s}`;
      }

      vapi.on("call-start", () => {
        setStatus("in call");
        startBtn.disabled = true;
        stopBtn.disabled = false;
      });

      vapi.on("call-end", () => {
        setStatus("idle");
        startBtn.disabled = false;
        stopBtn.disabled = true;
      });

      vapi.on("error", (e) => {
        console.error(e);
        setStatus("error (check console)");
        startBtn.disabled = false;
        stopBtn.disabled = true;
      });

      startBtn.onclick = async () => {
        setStatus("connecting...");
        await vapi.start(ASSISTANT_ID);
      };

      stopBtn.onclick = () => {
        vapi.stop();
      };
    </script>
  </body>
</html>
