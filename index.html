<!-- Put this inside your index.html (usually near the bottom before </body>) -->
<script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/vapi.js"></script>

<script>
  // 1) Add your Vapi PUBLIC key here (not private)
  const VAPI_PUBLIC_KEY = "PASTE_YOUR_PUBLIC_KEY_HERE";

  // 2) Use your new PPIS Academic Coordinator assistantId
  const ASSISTANT_ID = "b86a3d49-85cf-49db-b14f-3afe627c494c";

  // 3) Create client
  const vapi = new Vapi(VAPI_PUBLIC_KEY);

  // 4) Example: start/stop buttons (change IDs if your buttons are different)
  const startBtn = document.getElementById("start");
  const stopBtn = document.getElementById("stop");

  startBtn.onclick = () => vapi.start(ASSISTANT_ID);
  stopBtn.onclick = () => vapi.stop();

  // Optional status logs
  vapi.on("call-start", () => console.log("Call started"));
  vapi.on("call-end", () => console.log("Call ended"));
  vapi.on("error", (e) => console.error(e));
</script>
